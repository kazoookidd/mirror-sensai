services:
  front:
    build: ./front
    ports:
      - "3000:80"
    depends_on:
      - back

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    ports:
      - "8080:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL=${MODEL:-qwen2.5:3b}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    volumes:
      - sensai_data:/app/storage
      - sensai_docs:/app/data/docs
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.40.10
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Downloads the chat model and the embedding model once, into the ollama_models volume.
  ollama-init:
    image: ollama/ollama:0.40.10
    entrypoint: ["sh", "-c", "ollama pull \"$$MODEL\" && ollama pull bge-m3"]
    environment:
      - OLLAMA_HOST=ollama:11434
      - MODEL=${MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  sensai_data:
    name: sensai_data
  sensai_docs:
    name: sensai_docs
  ollama_models:
    name: sensai_ollama_models
